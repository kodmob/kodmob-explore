<div x-data="nobetciSayfa" data-testid="nobetci-sayfa">
  <section class="nobetci-sayfa container-site py-10 lg:py-14">
    <h1 class="h2">Nöbetçi Eczaneler</h1>
    <p class="mt-2 text-ink-2" x-show="bugun" x-cloak>
      <span x-text="bugun ? uzunTarih(bugun.tarih) : ''"></span> nöbetçileri.
      Nöbet <span x-text="devirSaati"></span>&#39;de devredilir; bu saatten önce bir önceki günün nöbetçisi açıktır.
    </p>

    <div class="mt-6 flex flex-col gap-3" x-show="durum === 'yukleniyor'">
      <span class="skeleton h-28"></span><span class="skeleton h-28"></span>
    </div>
    <p class="mt-6 card card-body text-ink-2" role="alert" x-show="durum === 'hata'" x-cloak>Nöbetçi listesi şu anda yüklenemedi. Sayfayı yenileyin ya da eczacı odasını arayın.</p>

    <template x-if="bugun">
      <div class="mt-6 flex flex-col gap-4">
        <p class="badge badge-warning self-start" x-show="bugun.ozel_gun" x-text="bugun.ozel_gun"></p>
        <p class="card card-body text-ink-2" x-show="!bugun.nobetler.length">Bugün için nöbetçi eczane yazılmamış. Eczacı odasını arayın.</p>
        <div class="grid gap-4 md:grid-cols-2">
          <template x-for="(n, i) in bugun.nobetler" :key="i">
            <article class="card card-body flex flex-col gap-3" data-testid="nobetci">
              <div>
                <p class="text-sm text-muted" x-show="cokBolge || vardiya[n.vardiya]" x-text="[cokBolge ? bolgeAdi(n.bolge_id) : '', vardiya[n.vardiya]].filter(Boolean).join(' · ')"></p>
                <h2 class="h3" x-text="eczaneAdi(n.eczane)"></h2>
                <p class="mt-1 text-ink-2" x-show="n.adres" x-text="n.adres"></p>
                <p class="text-sm text-muted" x-show="n.tarif" x-text="n.tarif"></p>
              </div>
              <div class="flex flex-wrap gap-2">
                <a class="btn btn-primary" x-show="n.telefon" :href="telBaglantisi(n.telefon)" x-text="'Ara: ' + n.telefon"></a>
                <a class="btn btn-secondary" :href="haritaBaglantisi(n)" target="_blank" rel="noopener">Haritada aç</a>
              </div>
            </article>
          </template>
        </div>
      </div>
    </template>

    <template x-if="sonraki.length">
      <div class="mt-10">
        <h2 class="h3">Önümüzdeki günler</h2>
        <div class="mt-3 overflow-x-auto">
          <table class="w-full text-left text-sm">
            <tbody>
              <template x-for="g in sonraki" :key="g.tarih">
                <tr class="border-b border-line align-top">
                  <th scope="row" class="whitespace-nowrap py-2 pr-4 font-medium">
                    <span x-text="uzunTarih(g.tarih)"></span>
                    <span class="block text-xs font-normal text-muted" x-show="g.ozel_gun" x-text="g.ozel_gun"></span>
                  </th>
                  <td class="py-2">
                    <span x-show="!g.nobetler.length" class="text-muted">Henüz yazılmadı</span>
                    <template x-for="(n, i) in g.nobetler" :key="i">
                      <span class="block">
                        <span class="text-muted" x-show="cokBolge || vardiya[n.vardiya]" x-text="[cokBolge ? bolgeAdi(n.bolge_id) : '', vardiya[n.vardiya]].filter(Boolean).join(' · ') + ': '"></span>
                        <span x-text="n.eczane"></span>
                        <a class="text-primary" x-show="n.telefon" :href="telBaglantisi(n.telefon)" x-text="n.telefon"></a>
                      </span>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </section>
</div>
